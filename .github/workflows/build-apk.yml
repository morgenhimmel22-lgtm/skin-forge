name: APK bauen v3

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository prüfen
        run: |
          echo "Workflow-Version 3"
          ls -la
          test -f lib/main.dart || { echo "FEHLER: lib/main.dart fehlt im Repository"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Feste Flutter-Version statt "stable", damit neue Flutter-Änderungen den Build nicht plötzlich brechen
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # Android-Ordner erzeugen; lib/main.dart bleibt unangetastet
      - name: Android-Projekt erzeugen
        run: |
          flutter create --platforms=android --project-name skinforge --org com.skinforge _tmp
          cp -r _tmp/android android
          rm -rf _tmp

      # Ohne diese Zeile hat die Release-APK keinen Internetzugriff
      - name: INTERNET-Berechtigung ergänzen
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      # Schreibt die pubspec.yaml mit passender SDK-Angabe, egal was im Repository steht
      - name: pubspec.yaml setzen
        run: |
          cat > pubspec.yaml << 'EOT'
          name: skinforge
          description: Minecraft-Skin- und Texture-Pack-Creator
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.3.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            image: ^4.2.0
            archive: ^3.6.1
            file_picker: ^8.1.2
            path_provider: ^2.1.0
            share_plus: ^10.0.0
          flutter:
            uses-material-design: true
          EOT

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Gefundene APK-Dateien anzeigen
        if: always()
        run: |
          find . -name '*.apk' -not -path './.git/*' || true

      # Lädt jede gefundene APK hoch, auch wenn Flutter den Ausgabepfad anders meldet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skinforge-apk
          path: |
            build/app/outputs/**/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: warn
