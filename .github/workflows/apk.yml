name: APK bauen
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter-Projekt initialisieren
        run: flutter create . --platforms=android --project-name skinforge --org com.skinforge

      - name: Dateien prüfen (Debug)
        run: ls -la android/app/

      - name: Set compileSdk to 36
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts

      - name: INTERNET-Berechtigung ergänzen
        run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: skinforge-apk
          path: build/app/outputs/flutter-apk/app-release.apk

