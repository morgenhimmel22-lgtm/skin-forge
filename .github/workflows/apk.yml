name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Feste Flutter-Version statt "stable", damit neue Flutter-Änderungen den Build nicht plötzlich brechen
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # Android-Ordner erzeugen; lib/main.dart und pubspec.yaml bleiben unangetastet
      - name: Android-Projekt erzeugen
        run: |
          flutter create --platforms=android --project-name skinforge --org com.skinforge _tmp
          cp -r _tmp/android android
          rm -rf _tmp

      # Ohne diese Zeile hat die Release-APK keinen Internetzugriff
      - name: INTERNET-Berechtigung ergänzen
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Gefundene APK-Dateien anzeigen
        if: always()
        run: |
          find . -name '*.apk' -not -path './.git/*' || true

      # Lädt jede gefundene APK hoch, auch wenn Flutter den Ausgabepfad anders meldet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skinforge-apk
          path: |
            build/app/outputs/**/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: warn
